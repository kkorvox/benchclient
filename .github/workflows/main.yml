name: Build BenchClient

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          ./gradle-8.4/bin/gradle wrapper --gradle-version 8.4 --project-dir .

      - name: Accept Minecraft EULA and set memory
        run: |
          mkdir -p $HOME/.gradle
          echo "org.gradle.jvmargs=-Xmx6144m -Xms2048m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "loom.platform=fabric" >> gradle.properties

      - name: Build JAR
        run: ./gradlew build --no-daemon --max-workers 1 --info
        env:
          JAVA_TOOL_OPTIONS: "-Xmx6144m -Xms2048m -XX:MaxMetaspaceSize=1024m"
          GRADLE_OPTS: "-Xmx6144m -Xms2048m -XX:MaxMetaspaceSize=1024m"

      - uses: actions/upload-artifact@v4
        with:
          name: benchclient-jar
          path: build/libs/benchclient-1.0.0.jar
          retention-days: 30
