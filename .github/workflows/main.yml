name: Build BenchClient

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build
        run: gradle build --no-daemon --max-workers 1
        env:
          GRADLE_OPTS: "-Xmx5g -Xms1g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
          JAVA_TOOL_OPTIONS: "-Xmx5g"

      - uses: actions/upload-artifact@v4
        with:
          name: benchclient-jar
          path: build/libs/benchclient-1.0.0.jar
          retention-days: 30
