name: Build BenchClient

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: |
          export GRADLE_OPTS="-Xmx6g -Xms2g -XX:MaxMetaspaceSize=1g"
          gradle build --no-daemon --max-workers 2
        env:
          JAVA_TOOL_OPTIONS: "-Xmx6g"

      - uses: actions/upload-artifact@v4
        with:
          name: benchclient-jar
          path: build/libs/benchclient-1.0.0.jar
          retention-days: 30
