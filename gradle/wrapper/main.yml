name: Build BenchClient

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.8-bin.zip
          unzip -q gradle-8.8-bin.zip
          ./gradle-8.8/bin/gradle wrapper --gradle-version 8.8

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --max-workers 1 --stacktrace
        env:
          GRADLE_OPTS: "-Xmx5g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC"
          JAVA_TOOL_OPTIONS: "-Xmx5g -XX:MaxMetaspaceSize=768m"

      - uses: actions/upload-artifact@v4
        with:
          name: benchclient-jar
          path: build/libs/benchclient-1.0.0.jar
          retention-days: 30
